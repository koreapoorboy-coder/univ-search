name = "curly-base-a1a9"
main = "worker.js"
compatibility_date = "2026-03-30"
keep_vars = true

[vars]
ALLOW_STUB = "false"
ENGINE_MODE = "production"
OPENAI_MODEL = "gpt-5"
# **검수를 껐다(2026-09-24).** 켜 두고 실전 4건을 돌렸더니 지적이 0건이었다.
# 깨끗해서가 아니었다 — 같은 보고서·설계서에 **목록을 없애고** 물으니 25건이 나왔다(₩327).
# 여덟(설계서는 여섯) 가지로 묶고 「문장을 그대로 인용하라」고 조인 것이 지적을 0으로 눌렀다.
#
# 그리고 찾은 흠 상당수가 **우리 템플릿 탓**이었다(범위를 유의성 근거로 쓰게 함, 정량 없는 절차,
# 안전 문구 미흡). 그런 흠은 학생마다 ₩327 을 내고 한 명씩 고칠 것이 아니라 엔진에서 고칠 것이다.
# 한 번 고치면 앞으로 모든 학생에게 적용되고 ₩0 이다.
#
# 검수는 이제 **우리 연장**으로 쓴다 — tools/review_reports_open.mjs.
# 템플릿 흠을 걷어낸 뒤에도 남는 흠이 있으면 그때 다시 켤지 판단한다.
REPORT_REVIEW = "off"

# 검수의 생각 단계. 2026-09-24 실측(물리·운동량 보고서):
#   low    → ₩47, 찾은 것은 「같은 수치를 두 번 적었다」 하나뿐
#   medium → ₩88~96, 「외력이 유의미했다면 p후가 작아졌을 것이다」를 잡았다(틀린 단정)
# 돈을 내는 기능이므로 medium 으로 둔다. 끄려면 REPORT_REVIEW = "off".
OPENAI_REASONING_EFFORT_REVIEW = "medium"
# Seeds come from our own Pages deploy, not jsDelivr@main: the repo is never pushed to GitHub, so a newly
# built seed (engine-index) would 404 there. Pages serves exactly what we deployed.
SEED_BASE_URL = "https://univ-search.pages.dev/keyword-engine/seed"

[[d1_databases]]
binding = "DB"
database_name = "keyword-engine-db"
database_id = "1bf11f1d-8747-4456-ace6-b0db6ff27d46"
