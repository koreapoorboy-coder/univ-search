<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학생 코드 받기 · 키워드 엔진</title>
<link rel="stylesheet" href="assets/student_screens.css?v=v1" />
<style>
  .codebox { text-align: center; }
  .codebox .who { color: var(--muted); font-size: .92rem; }
  .codebox .who + .who { margin-top: 4px; }
  .done-row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .done-row a, .done-row button { flex: 1 1 150px; }
</style>
</head>
<body>
<div class="page">
  <section class="hero">
    <a class="hero-badge" href="index.html">RNY 탐구보고서 프로그램</a>
    <h1>학생 코드 받기</h1>
    <p>코드 하나로 3년 동안 쓴 탐구보고서가 한 자리에 쌓입니다. 가입은 누구나 할 수 있고, 보고서를 만들려면 이용 권한이 있어야 합니다.</p>
  </section>

  <div id="already" class="note hide"></div>

  <div class="panel" id="form">
    <div class="field">
      <label for="joinCode">등록 코드 <span class="opt">· 학원에서 받았으면 넣어 주세요</span></label>
      <input id="joinCode" type="text" autocomplete="off" spellcheck="false" placeholder="ac-7k2pqm">
      <div class="hint" id="joinHint">없어도 가입은 됩니다. 이 경우 이용 권한은 따로 받아야 해요.</div>
    </div>
    <div class="field">
      <label for="name">이름</label>
      <input id="name" type="text" autocomplete="off" spellcheck="false" placeholder="홍길동">
    </div>
    <div class="field">
      <label for="school">다니는 고등학교 <span class="opt">· 수행평가를 내주는 학교</span></label>
      <input id="school" type="text" autocomplete="off" spellcheck="false" placeholder="○○고등학교">
    </div>
    <div class="field">
      <label for="phoneTail">전화번호 뒤 4자리</label>
      <input id="phoneTail" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="1234">
      <div class="hint">누가 결제했는지 맞추는 데만 씁니다. 번호 전체는 받지 않고, 문자도 보내지 않아요.</div>
    </div>
    <div class="field">
      <label>지금 학년</label>
      <div class="picks" id="gradePicks"></div>
    </div>
    <div class="field">
      <label>진로 계열 <span class="opt">· 나중에 바꿀 수 있어요</span></label>
      <div class="picks" id="trackPicks"></div>
    </div>
    <div class="field">
      <label for="major">가고 싶은 학과 <span class="opt">· 안 정했으면 비워 두세요</span></label>
      <input id="major" type="text" autocomplete="off" spellcheck="false" placeholder="예: 컴퓨터학과">
    </div>
    <button class="go" id="goBtn" type="button">코드 받기</button>
    <div class="msg hide" id="msg"></div>
  </div>

  <div id="done" class="hide"></div>

  <div class="foot">
    이름과 학교 이름은 내 기록 화면에만 쓰이고, 보고서를 만드는 AI에게는 보내지 않습니다.<br>
    이미 코드가 있다면 <a href="portfolio.html">내 탐구 기록 열기</a>.
  </div>
</div>

<script>
(function () {
  var WORKER = window.__KEYWORD_ENGINE_WORKER_BASE_URL || "https://curly-base-a1a9.koreapoorboy.workers.dev";
  var STORE_KEY = "keyword-engine:student-code";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  };
  // 사설 모드나 저장을 막아 둔 브라우저에서도 화면은 그대로 돌아가야 한다.
  var remember = function (code) { try { localStorage.setItem(STORE_KEY, code); } catch (error) { /* 저장 못 해도 화면에는 보인다 */ } };
  var recall = function () { try { return localStorage.getItem(STORE_KEY) || ""; } catch (error) { return ""; } };

  var GRADES = ["고1", "고2", "고3"];
  // 진로는 자유 문구로 저장되고 엔진이 낱말로 읽는다. 여기 6개는 학과 선택 화면과 같은 묶음이다.
  var TRACKS = ["공학계열", "자연과학계열", "의약·보건계열", "사회계열", "인문계열", "예체능계열", "아직 못 정했어요"];
  var state = { grade: "", track: "" };

  function picks(rootId, values, key) {
    var root = $(rootId);
    values.forEach(function (value) {
      var button = document.createElement("button");
      button.type = "button";
      button.textContent = value;
      button.setAttribute("aria-pressed", "false");
      button.addEventListener("click", function () {
        state[key] = state[key] === value ? "" : value;
        Array.prototype.forEach.call(root.children, function (node) {
          node.setAttribute("aria-pressed", node.textContent === state[key] ? "true" : "false");
        });
      });
      root.appendChild(button);
    });
  }
  picks("gradePicks", GRADES, "grade");
  picks("trackPicks", TRACKS, "track");

  var checked = { code: "", org: "" };
  function checkJoinCode() {
    var value = $("joinCode").value.trim().toLowerCase();
    var hint = $("joinHint");
    if (value === checked.code) return;
    checked = { code: value, org: "" };
    if (!/^ac-[a-z2-9]{6}$/.test(value)) {
      hint.className = "hint";
      hint.textContent = "학원에서 받은 코드를 넣어 주세요.";
      return;
    }
    hint.className = "hint";
    hint.textContent = "확인하는 중…";
    fetch(WORKER + "/license/check?joinCode=" + encodeURIComponent(value))
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (checked.code !== value) return;
        if (!data.ok) {
          hint.className = "hint bad";
          hint.textContent = data.error || "등록 코드를 찾을 수 없어요.";
          return;
        }
        checked.org = data.org || "";
        hint.className = "hint good";
        hint.textContent = (data.org || "등록 코드 확인됨")
          + (data.plan ? " · " + data.plan : "")
          + (data.seatsLeft > 0 ? " · 남은 자리 " + data.seatsLeft + "명" : " · 자리가 다 찼어요");
      })
      .catch(function () {
        if (checked.code !== value) return;
        hint.className = "hint";
        hint.textContent = "지금은 확인할 수 없어요. 그대로 눌러 보세요.";
      });
  }
  $("joinCode").addEventListener("blur", checkJoinCode);
  $("joinCode").addEventListener("change", checkJoinCode);

  function say(text) {
    var box = $("msg");
    box.textContent = text || "";
    box.className = text ? "msg" : "msg hide";
  }

  function planLine(data) {
    var parts = [];
    if (data && data.org) parts.push(data.org);
    if (data && data.maxUses > 0) parts.push("보고서 " + data.maxUses + "회");
    else if (data && data.maxUses < 0) parts.push("보고서 횟수 제한 없음");
    if (data && data.expiresAt) parts.push(String(data.expiresAt).slice(0, 10) + "까지");
    return parts.join(" · ");
  }
  // 0회는 무제한이 아니라 아직 권한이 없는 것이다. 빈 화면을 주면 학생은 고장으로 읽는다.
  function lockedLine(data) {
    if (!data || Number(data.maxUses) !== 0) return "";
    return "아직 보고서를 만들 수 있는 권한이 없어요. 결제한 곳에 이 코드를 알려 주면 권한이 열립니다.";
  }

  function showCode(code, name, school, data) {
    remember(code);
    $("form").className = "panel hide";
    $("already").className = "note hide";
    $("done").className = "";
    $("done").innerHTML = '<div class="note"><b>이 코드를 꼭 적어 두세요.</b><br>'
      + "이름으로는 다시 찾아 줄 수 없어요. 이름으로 찾을 수 있게 만들면, 남의 이름만 알아도 그 사람의 3년치를 열어 볼 수 있게 되기 때문입니다. "
      + "이 기기에는 저장해 두었지만, 폰을 바꾸거나 기록을 지우면 사라집니다. "
      + "<b>아래 ‘내 기록 열기’를 눌러 그 주소를 즐겨찾기 해 두세요.</b> 주소 안에 코드가 들어 있어서, 즐겨찾기 하나가 코드입니다. "
      + "그래도 잃어버렸다면 다니는 학원에 문의해 주세요.</div>"
      + '<div class="panel codebox"><div class="who">' + esc(name) + (school ? " · " + esc(school) : "") + "</div>"
      + '<div class="code-big">' + esc(code) + "</div>"
      + (planLine(data) ? '<div class="who">' + esc(planLine(data)) + "</div>" : "")
      + (lockedLine(data) ? '<div class="who" style="color:#a5281b">' + esc(lockedLine(data)) + "</div>" : "")
      + '<div class="who">보고서를 만들 때 이 코드를 넣으면 여기에 쌓입니다.</div>'
      + '<div class="done-row">'
      + '<button type="button" class="ghost" id="copyBtn">코드 복사</button>'
      + '<a class="btn" href="portfolio.html?code=' + encodeURIComponent(code) + '">내 기록 열기</a>'
      + "</div></div>";
    var copy = $("copyBtn");
    copy.addEventListener("click", function () {
      var done = function () { copy.textContent = "복사했어요"; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(done, function () { copy.textContent = "직접 적어 주세요"; });
      } else {
        copy.textContent = "직접 적어 주세요";
      }
    });
    window.scrollTo(0, 0);
  }

  $("goBtn").addEventListener("click", function () {
    var joinCode = $("joinCode").value.trim().toLowerCase();
    var name = $("name").value.trim();
    var school = $("school").value.trim();
    var major = $("major").value.trim();
    var phoneTail = $("phoneTail").value.replace(/\D/g, "");
    if (joinCode && !/^ac-[a-z2-9]{6}$/.test(joinCode)) { say("등록 코드 모양이 아니에요. 비워 두고 가입해도 됩니다."); $("joinCode").focus(); return; }
    if (!name) { say("이름을 적어 주세요."); $("name").focus(); return; }
    if (phoneTail.length !== 4) { say("전화번호 뒤 4자리를 넣어 주세요."); $("phoneTail").focus(); return; }
    if (!school) { say("학교 이름을 적어 주세요."); $("school").focus(); return; }
    if (!state.grade) { say("지금 학년을 골라 주세요."); return; }
    say("");
    $("goBtn").disabled = true;
    $("goBtn").textContent = "코드를 만드는 중…";
    fetch(WORKER + "/student/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        joinCode: joinCode, name: name, school: school, grade: state.grade, phoneTail: phoneTail,
        track: state.track === "아직 못 정했어요" ? "" : state.track,
        major: major
      })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        $("goBtn").disabled = false;
        $("goBtn").textContent = "코드 받기";
        if (!result.ok || !result.data.ok || !result.data.code) {
          say(result.data.error || "코드를 만들지 못했어요. 잠시 뒤 다시 눌러 주세요.");
          return;
        }
        showCode(result.data.code, name, school, result.data);
      })
      .catch(function () {
        $("goBtn").disabled = false;
        $("goBtn").textContent = "코드 받기";
        say("연결이 되지 않았어요. 잠시 뒤 다시 눌러 주세요.");
      });
  });

  // 같은 기기에서 두 번 받으면 먼저 쓴 보고서가 앞의 코드에 남아 흩어진다. 막지는 않되 먼저 알려 준다.
  var mine = recall();
  if (mine) {
    $("already").className = "note";
    $("already").innerHTML = "이 기기에서 이미 코드를 받았어요: <b>" + esc(mine) + "</b><br>"
      + '<a href="portfolio.html?code=' + encodeURIComponent(mine) + '">그 코드로 내 기록 열기</a>'
      + " · 새로 받으면 전에 쓴 보고서는 앞의 코드에 그대로 남습니다.";
  }
})();
</script>
</body>
</html>
