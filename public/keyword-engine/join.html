<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학생 코드 받기 · 키워드 엔진</title>
<style>
  :root {
    --ink: #1b1d21; --dim: #6a7078; --line: #e3e6ea; --bg: #f7f8fa; --card: #ffffff;
    --accent: #2f5bd7; --soft: #eef2fd; --warm: #fff6e8; --warmline: #f0d9b0; --bad: #c0392b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    line-height: 1.62; font-size: 15px; }
  .wrap { max-width: 620px; margin: 0 auto; padding: 28px 18px 80px; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.4px; }
  p.lead { color: var(--dim); margin: 0 0 22px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 14px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 0 0 6px; }
  label .opt { font-weight: 400; color: var(--dim); }
  .hint { margin-top: 6px; font-size: 13px; color: var(--dim); }
  .hint.good { color: var(--accent); }
  .hint.bad { color: var(--bad); }
  .field { margin-bottom: 18px; }
  input[type=text] { width: 100%; padding: 11px 13px; border: 1px solid var(--line);
    border-radius: 9px; font-size: 15px; font-family: inherit; }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .picks { display: flex; flex-wrap: wrap; gap: 7px; }
  .picks button { padding: 9px 14px; border: 1px solid var(--line); background: var(--card);
    border-radius: 999px; font-size: 14px; font-family: inherit; cursor: pointer; color: var(--ink); }
  .picks button[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); color: var(--accent); font-weight: 600; }
  .go { width: 100%; padding: 14px; border: 0; border-radius: 10px; background: var(--accent);
    color: #fff; font-size: 16px; font-family: inherit; cursor: pointer; }
  .go:disabled { background: #a8b4d4; cursor: default; }
  .msg { margin-top: 12px; font-size: 14px; color: var(--bad); }
  .warn { background: var(--warm); border: 1px solid var(--warmline); border-radius: 10px;
    padding: 12px 15px; font-size: 14px; margin-bottom: 14px; }
  .codebox { text-align: center; padding: 26px 20px; }
  .codebox .big { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 27px;
    letter-spacing: 1px; color: var(--accent); background: var(--soft); border-radius: 10px;
    padding: 14px 10px; margin: 12px 0 4px; word-break: break-all; }
  .codebox .who { color: var(--dim); font-size: 14px; }
  .row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .row a, .row button { flex: 1 1 140px; text-align: center; padding: 12px; border-radius: 9px;
    font-size: 15px; font-family: inherit; cursor: pointer; text-decoration: none;
    border: 1px solid var(--accent); background: var(--card); color: var(--accent); }
  .row a.fill { background: var(--accent); color: #fff; }
  .foot { margin-top: 30px; font-size: 13px; color: var(--dim); border-top: 1px solid var(--line); padding-top: 14px; }
  .foot a { color: var(--accent); }
  .hide { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>학생 코드 받기</h1>
  <p class="lead">학원에서 받은 등록 코드를 넣으면 내 학생 코드가 나옵니다. 코드 하나로 3년 동안 쓴 탐구보고서가 한 자리에 쌓입니다.</p>

  <div id="already" class="warn hide"></div>

  <div class="card" id="form">
    <div class="field">
      <label for="joinCode">등록 코드</label>
      <input id="joinCode" type="text" autocomplete="off" spellcheck="false" placeholder="ac-7k2pqm">
      <div class="hint" id="joinHint">학원에서 받은 코드를 넣어 주세요.</div>
    </div>
    <div class="field">
      <label for="name">이름</label>
      <input id="name" type="text" autocomplete="off" spellcheck="false" placeholder="홍길동">
    </div>
    <div class="field">
      <label for="school">다니는 고등학교 <span class="opt">· 수행평가를 내주는 학교</span></label>
      <input id="school" type="text" autocomplete="off" spellcheck="false" placeholder="○○고등학교">
    </div>
    <div class="field">
      <label>지금 학년</label>
      <div class="picks" id="gradePicks"></div>
    </div>
    <div class="field">
      <label>진로 계열 <span class="opt">· 나중에 바꿀 수 있어요</span></label>
      <div class="picks" id="trackPicks"></div>
    </div>
    <div class="field">
      <label for="major">가고 싶은 학과 <span class="opt">· 안 정했으면 비워 두세요</span></label>
      <input id="major" type="text" autocomplete="off" spellcheck="false" placeholder="예: 컴퓨터학과">
    </div>
    <button class="go" id="goBtn" type="button">코드 받기</button>
    <div class="msg hide" id="msg"></div>
  </div>

  <div id="done" class="hide"></div>

  <div class="foot">
    이름과 학교 이름은 내 기록 화면에만 쓰이고, 보고서를 만드는 AI에게는 보내지 않습니다.<br>
    이미 코드가 있다면 <a href="portfolio.html">내 탐구 기록 열기</a>.
  </div>
</div>

<script>
(function () {
  var WORKER = window.__KEYWORD_ENGINE_WORKER_BASE_URL || "https://curly-base-a1a9.koreapoorboy.workers.dev";
  var STORE_KEY = "keyword-engine:student-code";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  };
  // 사설 모드나 저장을 막아 둔 브라우저에서도 화면은 그대로 돌아가야 한다.
  var remember = function (code) { try { localStorage.setItem(STORE_KEY, code); } catch (error) { /* 저장 못 해도 화면에는 보인다 */ } };
  var recall = function () { try { return localStorage.getItem(STORE_KEY) || ""; } catch (error) { return ""; } };

  var GRADES = ["고1", "고2", "고3"];
  // 진로는 자유 문구로 저장되고 엔진이 낱말로 읽는다. 여기 6개는 학과 선택 화면과 같은 묶음이다.
  var TRACKS = ["공학계열", "자연과학계열", "의약·보건계열", "사회계열", "인문계열", "예체능계열", "아직 못 정했어요"];
  var state = { grade: "", track: "" };

  function picks(rootId, values, key) {
    var root = $(rootId);
    values.forEach(function (value) {
      var button = document.createElement("button");
      button.type = "button";
      button.textContent = value;
      button.setAttribute("aria-pressed", "false");
      button.addEventListener("click", function () {
        state[key] = state[key] === value ? "" : value;
        Array.prototype.forEach.call(root.children, function (node) {
          node.setAttribute("aria-pressed", node.textContent === state[key] ? "true" : "false");
        });
      });
      root.appendChild(button);
    });
  }
  picks("gradePicks", GRADES, "grade");
  picks("trackPicks", TRACKS, "track");

  var checked = { code: "", org: "" };
  function checkJoinCode() {
    var value = $("joinCode").value.trim().toLowerCase();
    var hint = $("joinHint");
    if (value === checked.code) return;
    checked = { code: value, org: "" };
    if (!/^ac-[a-z2-9]{6}$/.test(value)) {
      hint.className = "hint";
      hint.textContent = "학원에서 받은 코드를 넣어 주세요.";
      return;
    }
    hint.className = "hint";
    hint.textContent = "확인하는 중…";
    fetch(WORKER + "/license/check?joinCode=" + encodeURIComponent(value))
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (checked.code !== value) return;
        if (!data.ok) {
          hint.className = "hint bad";
          hint.textContent = data.error || "등록 코드를 찾을 수 없어요.";
          return;
        }
        checked.org = data.org || "";
        hint.className = "hint good";
        hint.textContent = (data.org || "등록 코드 확인됨")
          + (data.plan ? " · " + data.plan : "")
          + (data.seatsLeft > 0 ? " · 남은 자리 " + data.seatsLeft + "명" : " · 자리가 다 찼어요");
      })
      .catch(function () {
        if (checked.code !== value) return;
        hint.className = "hint";
        hint.textContent = "지금은 확인할 수 없어요. 그대로 눌러 보세요.";
      });
  }
  $("joinCode").addEventListener("blur", checkJoinCode);
  $("joinCode").addEventListener("change", checkJoinCode);

  function say(text) {
    var box = $("msg");
    box.textContent = text || "";
    box.className = text ? "msg" : "msg hide";
  }

  function planLine(data) {
    var parts = [];
    if (data && data.org) parts.push(data.org);
    if (data && data.maxUses > 0) parts.push("보고서 " + data.maxUses + "회");
    else if (data) parts.push("보고서 횟수 제한 없음");
    if (data && data.expiresAt) parts.push(String(data.expiresAt).slice(0, 10) + "까지");
    return parts.join(" · ");
  }

  function showCode(code, name, school, data) {
    remember(code);
    $("form").className = "card hide";
    $("already").className = "warn hide";
    $("done").className = "";
    $("done").innerHTML = '<div class="warn"><b>이 코드를 꼭 적어 두세요.</b><br>'
      + "이름으로는 다시 찾아 줄 수 없어요. 이름으로 찾을 수 있게 만들면, 남의 이름만 알아도 그 사람의 3년치를 열어 볼 수 있게 되기 때문입니다. "
      + "이 기기에는 저장해 두었지만, 폰을 바꾸거나 기록을 지우면 사라집니다. "
      + "<b>아래 ‘내 기록 열기’를 눌러 그 주소를 즐겨찾기 해 두세요.</b> 주소 안에 코드가 들어 있어서, 즐겨찾기 하나가 코드입니다. "
      + "그래도 잃어버렸다면 다니는 학원에 문의해 주세요.</div>"
      + '<div class="card codebox"><div class="who">' + esc(name) + (school ? " · " + esc(school) : "") + "</div>"
      + '<div class="big">' + esc(code) + "</div>"
      + '<div class="who">' + esc(planLine(data)) + "</div>"
      + '<div class="who">보고서를 만들 때 이 코드를 넣으면 여기에 쌓입니다.</div>'
      + '<div class="row">'
      + '<button type="button" id="copyBtn">코드 복사</button>'
      + '<a class="fill" href="portfolio.html?code=' + encodeURIComponent(code) + '">내 기록 열기</a>'
      + "</div></div>";
    var copy = $("copyBtn");
    copy.addEventListener("click", function () {
      var done = function () { copy.textContent = "복사했어요"; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(done, function () { copy.textContent = "직접 적어 주세요"; });
      } else {
        copy.textContent = "직접 적어 주세요";
      }
    });
    window.scrollTo(0, 0);
  }

  $("goBtn").addEventListener("click", function () {
    var joinCode = $("joinCode").value.trim().toLowerCase();
    var name = $("name").value.trim();
    var school = $("school").value.trim();
    var major = $("major").value.trim();
    if (!/^ac-[a-z2-9]{6}$/.test(joinCode)) { say("학원에서 받은 등록 코드를 넣어 주세요."); $("joinCode").focus(); return; }
    if (!name) { say("이름을 적어 주세요."); $("name").focus(); return; }
    if (!school) { say("학교 이름을 적어 주세요."); $("school").focus(); return; }
    if (!state.grade) { say("지금 학년을 골라 주세요."); return; }
    say("");
    $("goBtn").disabled = true;
    $("goBtn").textContent = "코드를 만드는 중…";
    fetch(WORKER + "/student/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        joinCode: joinCode, name: name, school: school, grade: state.grade,
        track: state.track === "아직 못 정했어요" ? "" : state.track,
        major: major
      })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        $("goBtn").disabled = false;
        $("goBtn").textContent = "코드 받기";
        if (!result.ok || !result.data.ok || !result.data.code) {
          say(result.data.error || "코드를 만들지 못했어요. 잠시 뒤 다시 눌러 주세요.");
          return;
        }
        showCode(result.data.code, name, school, result.data);
      })
      .catch(function () {
        $("goBtn").disabled = false;
        $("goBtn").textContent = "코드 받기";
        say("연결이 되지 않았어요. 잠시 뒤 다시 눌러 주세요.");
      });
  });

  // 같은 기기에서 두 번 받으면 먼저 쓴 보고서가 앞의 코드에 남아 흩어진다. 막지는 않되 먼저 알려 준다.
  var mine = recall();
  if (mine) {
    $("already").className = "warn";
    $("already").innerHTML = "이 기기에서 이미 코드를 받았어요: <b>" + esc(mine) + "</b><br>"
      + '<a href="portfolio.html?code=' + encodeURIComponent(mine) + '">그 코드로 내 기록 열기</a>'
      + " · 새로 받으면 전에 쓴 보고서는 앞의 코드에 그대로 남습니다.";
  }
})();
</script>
</body>
</html>
