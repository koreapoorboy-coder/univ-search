<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 탐구 기록 · 키워드 엔진</title>
<link rel="stylesheet" href="assets/student_screens.css?v=v1" />
<style>
  .who { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
  .who .name { font-size: 1.32rem; font-weight: 800; letter-spacing: -.5px; }
  .who .meta { color: var(--muted); font-size: .92rem; }
  .counts { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 15px; }
  .count { background: var(--primary-soft); border-radius: var(--radius-xs); padding: 8px 14px; font-size: .9rem; color: #2440a8; }
  .count b { font-size: 1.1rem; }
  .pass { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline;
    background: var(--accent-soft); border-radius: var(--radius-xs); padding: 11px 15px; margin-top: 13px; font-size: .92rem; }
  .pass b { font-size: 1.05rem; }
  .pass.out { background: var(--danger-soft); color: #9b2020; }
  .line-note { background: var(--warn); border: 1px solid var(--warn-line); border-radius: var(--radius-xs);
    padding: 12px 15px; font-size: .92rem; margin-top: 13px; }
  .year { margin-top: 20px; }
  .year > .label { font-weight: 800; font-size: .9rem; color: var(--primary); margin-bottom: 9px; }
  .rep { border-left: 3px solid var(--primary-soft); padding: 2px 0 2px 15px; margin-bottom: 17px; }
  .rep .tags { color: var(--muted); font-size: .85rem; margin-bottom: 3px; }
  .rep .title { font-weight: 700; letter-spacing: -.2px; }
  .rep summary { cursor: pointer; color: var(--primary); font-size: .85rem; margin-top: 7px; font-weight: 700; }
  .rep ul { margin: 8px 0 0; padding-left: 18px; font-size: .92rem; color: #3a4252; }
  .fit { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 15px 17px; margin-bottom: 10px; }
  .fit.picked { border-color: var(--primary); background: linear-gradient(180deg, #fff, #f7faff); }
  .fit .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
  .fit .head b { font-size: 1.05rem; }
  .fit .head span { color: var(--muted); font-size: .85rem; }
  .fit ul { margin: 11px 0 0; padding-left: 18px; font-size: .92rem; }
  .fit li { margin-bottom: 5px; }
  .fit .via { color: var(--muted); font-size: .85rem; }
  .open { margin-top: 11px; font-size: .85rem; color: var(--muted); }
  .ask { margin-top: 13px; font-size: .86rem; color: var(--muted); }
  .ask a { color: var(--primary); font-weight: 700; }
  .gate { display: flex; gap: 10px; flex-wrap: wrap; }
  .gate input { flex: 1 1 230px; min-width: 0; }
</style>
</head>
<body>
<div class="page">
  <section class="hero">
    <a class="hero-badge" href="index.html">RNY 탐구보고서 프로그램</a>
    <h1>내 탐구 기록</h1>
    <p>학생 코드 하나로 고등학교 3년 동안 쓴 보고서를 한 자리에서 봅니다.</p>
  </section>

  <div class="panel" id="gateCard">
    <div class="gate">
      <input id="codeInput" placeholder="sc-study0001-abcd" autocomplete="off" spellcheck="false">
      <button id="openBtn" type="button">열기</button>
    </div>
    <div class="msg hide" id="msg"></div>
    <div class="ask">코드가 없나요? <a href="join.html">코드 받기</a></div>
  </div>

  <div id="body" class="hide"></div>

  <div class="foot">
    이름과 학교 이름은 이 화면에만 남고, 보고서를 만드는 AI에게는 보내지 않습니다.
  </div>
</div>

<script>
(function () {
  var WORKER = window.__KEYWORD_ENGINE_WORKER_BASE_URL || "https://curly-base-a1a9.koreapoorboy.workers.dev";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  };

  function say(text) {
    var box = $("msg");
    box.textContent = text || "";
    box.className = text ? "msg" : "msg hide";
  }

  // 학년 순서는 고1 → 고2 → 고3. 저장 순서가 아니라 학생이 보낸 시간 순서로 읽힌다.
  var GRADE_ORDER = ["고1", "고2", "고3"];
  function gradeRank(grade) {
    var at = GRADE_ORDER.indexOf(String(grade || "").trim());
    return at < 0 ? 99 : at;
  }

  var METHOD_KO = {
    measurement: "직접 측정", survey: "설문", dataset: "공개 자료", reading: "문헌 읽기",
    observation: "관찰", experiment: "실험"
  };

  function renderReport(report) {
    var tags = [report.subject, report.concept].filter(Boolean);
    if (report.crossSubject && report.crossSubject.length) tags.push("융합 " + report.crossSubject.join("·"));
    if (report.collectionKind) tags.push(METHOD_KO[report.collectionKind] || report.collectionKind);
    var draft = (report.recordDraft || []).map(function (line) {
      return "<li>" + esc(line) + "</li>";
    }).join("");
    return '<div class="rep">'
      + '<div class="tags">' + esc(tags.join(" · ")) + "</div>"
      + '<div class="title">' + esc(report.title) + "</div>"
      + (report.axis ? '<div class="tags">축: ' + esc(report.axis.title) + "</div>" : "")
      + (draft ? "<details><summary>생활기록부에 적을 문장 보기</summary><ul>" + draft + "</ul></details>" : "")
      + "</div>";
  }

  function renderFit(row, isPicked) {
    if (row.unknown) {
      return '<div class="fit picked"><div class="head"><b>' + esc(row.major) + "</b>"
        + "<span>아직 교육과정 자료를 모아 두지 않은 학과예요</span></div></div>";
    }
    // 같은 보고서 제목을 과목마다 다시 쓰면 아무도 못 읽는다. 과목은 짧게 줄지어 놓고, 보고서는 아래 한 번만.
    var courses = (row.touched || []).slice(0, 6).map(function (course) {
      var subjects = [];
      (course.via || []).forEach(function (link) {
        if (subjects.indexOf(link.subject) < 0) subjects.push(link.subject);
      });
      return "<li><b>" + esc(course.title) + "</b> <span class=\"via\">"
        + esc(course.year) + "학년 · " + esc(subjects.join("·")) + "</span></li>";
    }).join("");
    var more = (row.touched || []).length - 6;
    if (more > 0) courses += '<li class="via">그 밖에 ' + esc(more) + "개</li>";

    var backing = [];
    (row.touched || []).forEach(function (course) {
      (course.via || []).forEach(function (link) {
        (link.reports || []).forEach(function (report) {
          var label = (report.grade ? report.grade + " " : "") + report.title;
          if (backing.indexOf(label) < 0) backing.push(label);
        });
      });
    });
    var from = backing.slice(0, 4).map(function (label) {
      return "<div>· " + esc(label.length > 46 ? label.slice(0, 46) + "…" : label) + "</div>";
    }).join("");
    var open = (row.open || []).slice(0, 3).map(function (course) {
      return esc(course.title) + "(" + esc((course.needs || []).join("·")) + ")";
    }).join(", ");
    return '<div class="fit' + (isPicked ? " picked" : "") + '">'
      + '<div class="head"><b>' + esc(row.major) + "</b>"
      // 아직 아무것도 안 한 학생에게 "0개가 닿아 있음"이라고 세어 주지 않는다. 셀 것이 없으면 안 센다.
      + "<span>" + (row.touchedCount
        ? "대학 과목 " + esc(row.touchedCount) + "개가 내 보고서와 닿아 있음"
          + (row.courseCount ? " · 조사한 과목 " + esc(row.courseCount) + "개 중" : "")
        : "아직 닿은 보고서가 없어요"
          + (row.courseCount ? " · 이 학과 과목 " + esc(row.courseCount) + "개를 읽어 뒀어요" : "")) + "</span></div>"
      + (row.crossOnly ? '<div class="open">주 과목이 아니라 <b>융합으로 끌어온 과목</b>으로만 닿았어요. 이 학과 쪽이라고 말하기엔 아직 약한 연결입니다.</div>' : "")
      + (courses ? "<ul>" + courses + "</ul>" : "")
      + (from ? '<div class="open"><b>닿게 한 보고서</b>' + from + "</div>" : "")
      + (open ? '<div class="open">아직 안 닿은 곳: ' + open + "</div>" : "")
      + "</div>";
  }

  function render(data) {
    var student = data.student || {};
    var summary = data.summary || {};
    var reports = (data.reports || []).slice().sort(function (a, b) { return gradeRank(a.grade) - gradeRank(b.grade); });
    var html = "";

    html += '<div class="panel"><div class="who">'
      + '<span class="name">' + esc(student.name) + "</span>"
      + '<span class="meta">' + esc([student.school, student.gradeNow || student.enteredGrade, student.track, student.major].filter(Boolean).join(" · ")) + "</span>"
      + '<span class="code">' + esc(student.code) + "</span></div>"
      + '<div class="counts">'
      + '<div class="count">보고서 <b>' + esc(summary.reportCount || 0) + "</b>편</div>"
      + '<div class="count">과목 <b>' + esc((summary.subjects || []).length) + "</b>개</div>"
      + '<div class="count">축 <b>' + esc((summary.axes || []).length) + "</b>개</div>"
      + "</div>";
    var pass = data.pass;
    if (pass) {
      var bits = [];
      if (pass.org) bits.push(esc(pass.org));
      if (pass.maxUses > 0) bits.push("남은 보고서 <b>" + esc(pass.remaining) + "</b>회 <span class=\"meta\">/ " + esc(pass.maxUses) + "회</span>");
      else bits.push("보고서 <b>횟수 제한 없음</b>");
      if (pass.expiresAt) bits.push(esc(String(pass.expiresAt).slice(0, 10)) + "까지");
      var trouble = pass.ok ? "" : ({
        NO_GRANT: "아직 보고서를 만들 수 있는 권한이 없어요. 결제한 곳에 이 코드를 알려 주세요.",
        NO_USES: "횟수를 모두 썼어요. 학원에 문의해 주세요.",
        EXPIRED: "이용 기간이 끝났어요. 학원에 문의해 주세요.",
        DISABLED: "지금은 쓸 수 없는 코드예요. 학원에 문의해 주세요."
      }[pass.reason] || "지금은 새 보고서를 만들 수 없어요. 학원에 문의해 주세요.");
      html += '<div class="pass' + (pass.ok ? "" : " out") + '">' + bits.join("<span>·</span>")
        + (trouble ? "<span>" + esc(trouble) + "</span>" : "") + "</div>";
    }
    if ((summary.lines || []).length) {
      html += '<div class="line-note">3년을 관통하는 줄기: '
        + esc(summary.lines.map(function (line) { return line.name + "(" + line.count + "편)"; }).join(", "))
        + "<br>한 편은 보고서지만, 같은 축이 여러 번 나오면 방향이 됩니다.</div>";
    }
    html += "</div>";

    html += "<h2>3년 기록</h2>";
    if (!reports.length) {
      html += '<div class="panel flat">아직 저장된 보고서가 없어요. 보고서를 만들 때 학생 코드를 넣으면 여기에 쌓입니다.</div>';
    } else {
      GRADE_ORDER.concat(["기타"]).forEach(function (grade) {
        var mine = reports.filter(function (report) {
          return grade === "기타" ? gradeRank(report.grade) === 99 : report.grade === grade;
        });
        if (!mine.length) return;
        html += '<div class="year"><div class="label">' + esc(grade) + " · " + mine.length + "편</div>"
          + mine.map(renderReport).join("") + "</div>";
      });
    }

    var fit = data.fit;
    if (fit) {
      html += "<h2>학과와 닿은 곳</h2>";
      html += '<div class="panel flat">' + esc(fit.note) + "</div>";
      if (fit.picked) html += renderFit(fit.picked, true);
      (fit.ranked || []).forEach(function (row) {
        if (fit.picked && row.major === fit.picked.major) return;
        html += renderFit(row, false);
      });
      html += '<div class="open">학과 ' + esc(fit.checked) + "개의 실제 교육과정을 읽어 비교한 결과입니다. 점수가 아니라, 어떤 보고서가 어떤 대학 과목과 닿았는지 그대로 적었습니다.</div>";
    }

    $("body").innerHTML = html;
    $("body").className = "";
  }

  function open(code) {
    say("");
    $("openBtn").disabled = true;
    fetch(WORKER + "/student/portfolio?code=" + encodeURIComponent(code))
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        $("openBtn").disabled = false;
        if (!result.ok || !result.data.ok) {
          $("body").className = "hide";
          say(result.data.error || "기록을 불러오지 못했어요.");
          return;
        }
        render(result.data);
      })
      .catch(function () {
        $("openBtn").disabled = false;
        say("연결이 되지 않았어요. 잠시 뒤 다시 눌러 주세요.");
      });
  }

  $("openBtn").addEventListener("click", function () {
    var code = $("codeInput").value.trim().toLowerCase();
    if (!code) { say("학생 코드를 적어 주세요."); return; }
    open(code);
  });
  $("codeInput").addEventListener("keydown", function (event) {
    if (event.key === "Enter") $("openBtn").click();
  });

  // 링크로 바로 열 수 있게. 선생님이 학생에게 주소만 보내도 되도록.
  // 없으면 이 기기에서 받은 코드를 채워 둔다 — 코드는 이름으로 되찾을 수 없으니 기기가 대신 기억한다.
  var fromUrl = new URLSearchParams(location.search).get("code");
  var mine = "";
  try { mine = localStorage.getItem("keyword-engine:student-code") || ""; } catch (error) { mine = ""; }
  var code = (fromUrl || mine || "").trim().toLowerCase();
  if (code) {
    $("codeInput").value = code;
    try { localStorage.setItem("keyword-engine:student-code", code); } catch (error) { /* 저장 못 해도 화면은 돈다 */ }
    open(code);
  }
})();
</script>
</body>
</html>
