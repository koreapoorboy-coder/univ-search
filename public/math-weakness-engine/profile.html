<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>학생 관측축 누적 프로파일</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:22px;line-height:1.5;color:#111827;background:#f8fafc;max-width:960px}
  h1{font-size:21px}h2{font-size:16px;margin-top:22px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px;margin:14px 0}
  label{font-weight:600}
  .codegrp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
  .codepfx{font-family:ui-monospace,Consolas,monospace;font-weight:700;background:#eef2ff;border:1px solid #c7d2fe;border-radius:6px;padding:6px 8px;color:#3730a3;user-select:none}
  #code_num{width:96px;font-family:ui-monospace,Consolas,monospace;font-size:16px;text-align:center;letter-spacing:3px;padding:6px}
  button{padding:9px 14px;border:0;border-radius:8px;background:#111827;color:#fff;cursor:pointer;margin:2px}
  button.ghost{background:#e2e8f0;color:#111827}
  table{border-collapse:collapse;width:100%;margin-top:10px;font-size:13px}
  th,td{border:1px solid #e5e7eb;padding:6px 8px;text-align:left;vertical-align:top}
  th{background:#f1f5f9}
  .muted{color:#64748b;font-size:13px}
  .axisbar{display:inline-block;height:10px;background:#ef4444;border-radius:3px;vertical-align:middle}
  .chip{display:inline-block;padding:2px 8px;border-radius:999px;background:#e2e8f0;margin:2px;font-size:12px;cursor:pointer}
  .big{font-size:20px;font-weight:700}
  code{background:#e2e8f0;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<h1>학생 관측축 누적 프로파일 <span class="muted">(A안 · 이 브라우저 로컬 저장)</span></h1>
<p class="muted">진단 페이지에서 저장된 <code>observed_axes</code> 를 학생코드로 묶어 봅니다. 데이터는 이 브라우저에만 있습니다 — 정기적으로 <b>내보내기(JSON)</b> 로 보관하세요.</p>

<div class="card">
  <label for="code_num">학생 코드 조회</label>
  <div class="codegrp">
    <span class="codepfx">SC-STUDY-</span>
    <input id="code_num" inputmode="numeric" maxlength="3" placeholder="001" autocomplete="off" />
    <button id="lookup_btn">조회</button>
    <span id="code_preview" class="muted"></span>
  </div>
  <div id="students_list" class="muted" style="margin-top:10px"></div>
</div>

<div id="out"></div>

<div class="card">
  <h2>서버 저장 (D1) · 동기화</h2>
  <p class="muted">서버를 설정하면 진단 시 로컬과 서버에 함께 저장(이중쓰기)됩니다. 서버 미설정이면 로컬만(기존과 동일).</p>
  <label for="srv_url">Worker 주소</label>
  <input id="srv_url" type="text" placeholder="https://math-diagnosis-worker.____.workers.dev" />
  <label for="srv_key">쓰기 키 (교사 배정 · 진단 페이지와 동일 값)</label>
  <input id="srv_key" type="text" placeholder="RECORD_WRITE_KEY 값" autocomplete="off" />
  <div style="margin-top:8px">
    <button id="srv_save">서버 설정 저장</button>
    <button id="srv_migrate" class="ghost">기존 로컬 → 서버 이관</button>
    <button id="srv_sync" class="ghost">지금 동기화(미동기 재전송)</button>
  </div>
  <div id="sync_status" class="muted" style="margin-top:8px"></div>
  <div id="transition_panel" style="margin-top:10px"></div>
</div>

<div class="card">
  <h2>데이터 백업 / 이전</h2>
  <p class="muted">A안은 이 브라우저에만 저장됩니다. 기기 변경·초기화 대비로 내보내 보관하고, 새 기기에서 가져오세요.</p>
  <button id="export_btn">전체 내보내기 (JSON)</button>
  <button id="import_btn" class="ghost">가져오기 (JSON 파일)</button>
  <input id="import_file" type="file" accept="application/json,.json" style="display:none" />
  <span id="io_status" class="muted"></span>
</div>

<script src="assets/math_axis_accumulation.js?v=fixA-worktext"></script>
<script>
  const $ = s => document.querySelector(s);
  const PFX = 'SC-STUDY-';
  const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]));
  function digits() { return String($('#code_num').value || '').replace(/\D/g, '').slice(0, 3); }
  function fullCode() { const d = digits(); return d ? PFX + d.padStart(3, '0') : ''; }

  function renderStudents() {
    const list = MathAxisStore.students();
    if (!list.length) { $('#students_list').innerHTML = '저장된 학생 없음 — 진단 페이지에서 학생코드로 진단하면 여기 쌓입니다.'; return; }
    $('#students_list').innerHTML = '저장된 학생: ' + list.map(s =>
      `<span class="chip" data-code="${esc(s.student_code)}">${esc(s.student_code)} · ${s.exam_count}회</span>`).join(' ');
    document.querySelectorAll('#students_list .chip').forEach(ch => ch.onclick = () => {
      const code = ch.getAttribute('data-code');
      $('#code_num').value = code.replace(PFX, '');
      lookup();
    });
  }

  async function lookup() {
    const code = fullCode();
    $('#code_preview').textContent = code ? '→ ' + code : '';
    if (!code) { $('#out').innerHTML = '<div class="card">학생 코드 3자리를 입력하세요.</div>'; return; }
    let records = null, source = '로컬';   // 서버 설정 시 서버 우선, 실패 시 localStorage 폴백
    try {
      const sp = await MathAxisStore.fetchServerProfile(code);
      if (sp && sp.ok && Array.isArray(sp.records)) { records = sp.records; source = '서버'; }
    } catch (e) { source = '로컬(서버 조회 실패: ' + esc(String(e && e.message || e)) + ')'; }
    if (!records) records = MathAxisStore.listByStudent(code);
    if (!records.length) { $('#out').innerHTML = `<div class="card">${esc(code)} 기록이 없습니다. <span class="muted">(조회: ${esc(source)})</span></div>`; return; }
    const agg = MathAxisStore.aggregateAxes(records);
    const maxWrong = Math.max(1, ...agg.map(a => a.wrong));
    const axisRows = agg.map(a =>
      `<tr><td class="big">${esc(a.axis)}</td>
        <td>${a.wrong} <span class="axisbar" style="width:${Math.round(120 * a.wrong / maxWrong)}px"></span></td>
        <td>${a.total}</td><td>${a.exams}</td></tr>`).join('');
    const examRows = records.map(r => {
      const tags = (r.attempts || []).flatMap(x => x.observed_error_tags || []);
      const uniqTags = [...new Set(tags)];
      return `<tr>
        <td>${esc((r.date || '').slice(0, 10))}</td>
        <td>${esc(r.exam_label || '')}</td>
        <td>${(r.scope_units || []).length}</td>
        <td>${(r.attempts || []).length}</td>
        <td>${(r.observed_axes || []).map(a => `${esc(a.axis)}·${a.wrong}`).join(' / ')}</td>
        <td class="muted">${esc(uniqTags.slice(0, 6).join(', '))}${uniqTags.length > 6 ? ' …' : ''}</td>
        <td class="muted">${esc(r.axis_map_version || '')}</td>
      </tr>`;
    }).join('');
    $('#out').innerHTML =
      `<div class="card"><h2>${esc(code)} · 축 합산 <span class="muted">(${records.length}개 시험 · 조회 ${esc(source)})</span></h2>
        <p class="muted">wrong 이 반복해서 높은 축 = 이 학생의 반복 취약축.</p>
        <table><tr><th>축</th><th>wrong(합)</th><th>total(합)</th><th>등장 시험수</th></tr>${axisRows}</table></div>
       <div class="card"><h2>시험 목록</h2>
        <table><tr><th>날짜</th><th>범위(라벨)</th><th>단원수</th><th>문항수</th><th>이 시험 축</th><th>관측 태그(원본)</th><th>축맵ver</th></tr>${examRows}</table></div>`;
  }

  $('#code_num').addEventListener('input', () => { const d = digits(); if ($('#code_num').value !== d) $('#code_num').value = d; $('#code_preview').textContent = fullCode() ? '→ ' + fullCode() : ''; });
  $('#code_num').addEventListener('keydown', e => { if (e.key === 'Enter') lookup(); });
  $('#lookup_btn').onclick = lookup;

  $('#export_btn').onclick = () => {
    const blob = new Blob([MathAxisStore.exportAll()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'scstudy_axis_records.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(a.href);
    $('#io_status').textContent = ` · 내보냄 (${MathAxisStore.all().length}개 레코드)`;
  };
  $('#import_btn').onclick = () => $('#import_file').click();
  $('#import_file').onchange = async (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const text = await f.text();
    const res = MathAxisStore.importJson(text, { merge: true });
    $('#io_status').textContent = res.ok ? ` · 가져옴 +${res.added} (총 ${res.total})` : ` · 실패: ${res.error}`;
    renderStudents();
    if (fullCode()) lookup();
    e.target.value = '';
  };

  // ── 서버 설정·동기화 ──
  function renderSyncStatus() {
    renderTransition();   // 항상 그린다(아래 early-return 분기에 안 걸리게 맨 앞).
    const s = MathAxisStore.getServer(); const el = $('#sync_status');
    if (!s || !s.url) { el.innerHTML = '<span class="muted">서버 미설정 — 로컬만 저장(기존과 동일). Worker 주소·키를 넣고 저장하면 이중쓰기 시작.</span>'; return; }
    const st = MathAxisStore.pendingStatus();
    if (st.local === 0) { el.innerHTML = '<span class="muted">서버 설정됨 · 로컬 기록 없음.</span>'; return; }
    if (st.count === 0) { el.innerHTML = `<span style="color:#166534">서버 설정됨 · 로컬 ${st.local}건 전부 서버 확인됨(미동기 0).</span>`; return; }
    const reasons = Object.entries(st.reasons).map(([k, v]) => `${k}:${v}`).join(', ');
    const warn = st.aged;
    const breakdown = (st.failed ? `실패 ${st.failed}` : '') + (st.failed && st.never_tried ? ', ' : '') + (st.never_tried ? `미시도 ${st.never_tried}` : '');
    el.innerHTML = `<span style="color:${warn ? '#b91c1c' : '#9a3412'};font-weight:${warn ? '700' : '400'}">⚠ 서버 미동기 ${st.count}/${st.local}건`
      + (breakdown ? ` (${breakdown})` : '')
      + (st.oldest_age_days != null ? ` · 가장 오래된 실패 ${st.oldest_age_days}일${warn ? ' (7일↑ 방치!)' : ''}` : '')
      + (reasons ? ` · 사유(${esc(reasons)})` : '') + `</span> — [기존 로컬→서버 이관] 또는 [지금 동기화]로 올리세요.`;
  }
  function renderTransition() {
    const el = $('#transition_panel'); if (!el) return;
    const s = MathAxisStore.getServer();
    if (!s || !s.url) { el.innerHTML = ''; return; }
    const t = MathAxisStore.transitionState();
    const row = c => `<div style="display:flex;gap:6px;align-items:baseline"><span>${c.ok ? '✅' : '⬜'}</span><span>${esc(c.label)}</span><span class="muted">— 현재 ${esc(String(c.cur))}${c.extra ? (' · ' + esc(c.extra)) : ''}</span></div>`;
    el.innerHTML = `<div style="padding:10px;border:1px solid #e5e7eb;border-radius:8px;background:#fafafa">
      <b>서버 전환 준비도</b> ${t.all_met ? '<span style="color:#166534;font-weight:700">— 4기준 충족! 수동 전환 가능</span>' : '<span class="muted">— 관측 중(4기준 모두 충족 시 전환)</span>'}
      <div style="margin-top:6px;display:grid;gap:3px">
        ${row(t.criteria.c1_records)}${row(t.criteria.c2_streak)}${row(t.criteria.c3_students)}${row(t.criteria.c4_time)}
      </div>
      <div class="muted" style="margin-top:6px">이중쓰기 시작 ${t.started_at ? esc(t.started_at.slice(0, 10)) : '–'} · 경과 ${t.days_elapsed == null ? '–' : t.days_elapsed}일 · 로컬 ${t.local_count} / 서버확정 ${t.synced_count}</div>
    </div>`;
  }
  function loadServerFields() { const s = MathAxisStore.getServer() || {}; $('#srv_url').value = s.url || ''; $('#srv_key').value = s.key || ''; }
  $('#srv_save').onclick = () => { MathAxisStore.setServer({ url: $('#srv_url').value.trim(), key: $('#srv_key').value.trim() }); renderSyncStatus(); $('#sync_status').innerHTML += ' <span class="muted">· 저장됨</span>'; };
  $('#srv_sync').onclick = async () => { $('#sync_status').textContent = '동기화 중...'; const r = await MathAxisStore.retryPending(); renderSyncStatus(); if (r && !r.skipped) $('#sync_status').innerHTML += ` <span class="muted">· 재전송 성공 ${r.ok} 실패 ${r.fail}</span>`; };
  $('#srv_migrate').onclick = async () => { if (!confirm('로컬의 모든 레코드를 서버로 이관(멱등)합니다. 진행할까요?')) return; $('#sync_status').textContent = '이관 중...'; const r = await MathAxisStore.pushAllToServer(); renderSyncStatus(); $('#sync_status').innerHTML += r.skipped ? ' <span class="muted">· 서버 미설정</span>' : ` <span class="muted">· 이관 ${r.ok}/${r.total} (남은 미동기 ${r.remaining})</span>`; };
  loadServerFields();
  renderSyncStatus();
  MathAxisStore.retryPending();   // 페이지 열 때 미동기 자동 재시도(멱등·서버 미설정이면 no-op)

  renderStudents();

  // 진단 페이지에서 "이 학생 기록 보기"로 넘어오면 ?code=007 (또는 SC-STUDY-007) 자동 조회.
  (function fromQuery() {
    try {
      const q = new URLSearchParams(location.search).get('code');
      if (!q) return;
      const d = String(q).replace(/\D/g, '').slice(0, 3);
      if (!d) return;
      $('#code_num').value = d;
      $('#code_num').dispatchEvent(new Event('input'));
      lookup();
    } catch (e) {}
  })();
</script>
</body>
</html>
