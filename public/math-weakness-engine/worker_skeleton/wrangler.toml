name = "math-diagnosis-worker"
main = "math_diagnosis_worker.js"
compatibility_date = "2026-07-08"

[vars]
ENGINE_MODE = "production"
ANTHROPIC_MODEL = "claude-opus-4-8"
ANTHROPIC_EFFORT = "high"
ALLOW_STUB = "false"
FALLBACK_ON_AI_ERROR = "true"

# Set secret separately, never commit API keys.
# wrangler secret put ANTHROPIC_API_KEY

# ── 관측축 누적 저장 (B: D1) ──
# 운영 Dashboard에서 확인한 기존 바인딩을 배포 시에도 보존한다.
[[d1_databases]]
binding = "AXIS_DB"
database_name = "scstudy-axis"
database_id = "8d8ded1c-bae9-42dd-a322-4bb5b960a754"

# 스키마: data/db/axis_records.schema.v1.sql
# 쓰기키(record/profile 보호): Cloudflare Secret RECORD_WRITE_KEY
